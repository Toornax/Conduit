[package]
name = "conduit-kmd"
description = "Pilote noyau Windows des câbles Conduit (PortCls/WaveRT, WDM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Pilote WDM (pas de KMDF) : PortCls fournit lui-même le modèle de périphérique.
[package.metadata.wdk.driver-model]
driver-type = "WDM"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdk.workspace = true
wdk-alloc.workspace = true
wdk-sys.workspace = true
# Bindings PortCls/KS générés (mode C), crate autonome testable en mode utilisateur.
portcls-sys = { path = "../portcls-sys" }
# Enveloppes sûres traits Rust ↔ vtables PortCls (M1a-04, M1a-05) ; la feature `kernel`
# ajoute les enveloppes de `PcNewPort`/`PcRegisterSubdevice`/`PcRegisterPhysicalConnection`
# (symboles de `portcls.lib`, lié par build.rs), utilisées par `adapter::start_device`
# (M1a-06).
portcls = { path = "../portcls", features = ["kernel"] }
# Logique portable du pilote (workspace racine, `no_std`, sans `unsafe`) : validation des
# formats (M1a-06), horloge virtuelle et copie cyclique (M1a-07, M1a-08).
conduit-kmd-core = { path = "../../../crates/conduit-kmd-core" }

[lints]
workspace = true
