[package]
name = "portcls"
description = "Enveloppes sûres entre traits Rust et vtables PortCls (workspace noyau, testé en mode utilisateur)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `no_std` + `alloc` : l'allocateur global vient du binaire final (`wdk-alloc` dans
# `conduit-kmd`, celui de `std` sous `cargo test`). Aucune dépendance à `wdk-sys` : le
# crate se teste en mode utilisateur avec de faux ports (`tests/`).
[dependencies]
conduit-com = { path = "../../../crates/conduit-com" }
portcls-sys = { path = "../portcls-sys", features = ["com"] }
# Contrat du jeu de propriétés privé (M1b-04) : `src/config.rs` en tire le GUID du jeu, la
# structure d'échange et TOUT son parseur. Le crate est `no_std`, sans dépendance, et sans
# `unsafe` : c'est ce qui rend la validation fuzzable en mode utilisateur (M1b-08), donc
# elle ne doit pas être réécrite ici. `tests/inf.rs` s'en sert aussi pour engendrer les
# défauts de `[ConduitCable_HW_AddReg]` depuis `conduit_kmd_core::params` et
# `conduit_kmd_core::config`.
conduit-kmd-core = { path = "../../../crates/conduit-kmd-core" }

# `kernel` : enveloppes des fonctions `Pc*` de `portcls.sys` (`adapter::new_port`,
# `register_subdevice`, `register_physical_connection`), symboles que seul le pilote lie
# (`conduit-kmd/build.rs`), et traces de débogage (`pc_log!`, actives seulement en profil
# `dev`). Activée par `conduit-kmd` ; hors feature, le crate reste testable en mode
# utilisateur sans symbole non résolu.
[features]
default = []
kernel = []

[lints]
workspace = true
