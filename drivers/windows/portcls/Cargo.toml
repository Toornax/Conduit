[package]
name = "portcls"
description = "Enveloppes sûres entre traits Rust et vtables PortCls (workspace noyau, testé en mode utilisateur)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `no_std` + `alloc` : l'allocateur global vient du binaire final (`wdk-alloc` dans
# `conduit-kmd`, celui de `std` sous `cargo test`). Aucune dépendance à `wdk-sys` : le
# crate se teste en mode utilisateur avec de faux ports (`tests/`).
[dependencies]
conduit-com = { path = "../../../crates/conduit-com" }
portcls-sys = { path = "../portcls-sys", features = ["com"] }

# `tests/inf.rs` engendre conduit_kmd.inx depuis les constantes Rust ; les défauts des
# paramètres de registre (M1b-01) sont ceux de `conduit_kmd_core::params`, source unique
# partagée avec le pilote. Dépendance de test seulement : `portcls` lui-même n'en a pas
# besoin.
[dev-dependencies]
conduit-kmd-core = { path = "../../../crates/conduit-kmd-core" }

# `kernel` : enveloppes des fonctions `Pc*` de `portcls.sys` (`adapter::new_port`,
# `register_subdevice`, `register_physical_connection`), symboles que seul le pilote lie
# (`conduit-kmd/build.rs`). Activée par `conduit-kmd` ; hors feature, le crate reste
# testable en mode utilisateur sans symbole non résolu.
[features]
default = []
kernel = []

[lints]
workspace = true
