[workspace]
resolver = "2"
members = [
    "crates/conduit-core",
    "crates/conduit-engine",
    "crates/conduit-backend",
    "crates/conduit-backend-wasapi",
    "crates/conduit-backend-pipewire",
    "crates/conduit-backend-coreaudio",
    "crates/conduit-protocol",
    "crates/conduitd",
    "crates/conduitctl",
    "crates/conduit-gui",
    "crates/conduit-testing",
    "crates/conduit-kmd-core",
    "crates/conduit-com",
    "crates/conduit-looptest",
    "crates/conduit-helper",
]
# Ce que ce workspace ne construit pas : `drivers/windows` est le workspace noyau,
# indépendant (ADR-012), et les trois crates `fuzz` ne sont constructibles qu'en nightly
# (`libfuzzer-sys`), donc hors de portée de `--workspace` et du check `cross-windows` de
# `nix/checks.nix`.
#
# **`exclude` ne suffit pas** pour un crate logé **sous** un membre : cargo ne l'y honore
# pas, et `cargo build` depuis `crates/*/fuzz` échoue sur « current package believes it's
# in a workspace when it's not ». C'est le `[workspace]` vide de chaque `fuzz/Cargo.toml`
# qui les affranchit ; ces lignes-ci disent l'intention et couvrent `drivers/windows`
# (M1b-08).
exclude = [
    "crates/conduit-protocol/fuzz",
    "crates/conduit-kmd-core/fuzz",
    "crates/conduit-helper/fuzz",
    "drivers/windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ToorNax/conduit"
authors = ["Conduit contributors"]

[workspace.dependencies]
conduit-core = { path = "crates/conduit-core", version = "0.1.0", default-features = false }
conduit-engine = { path = "crates/conduit-engine", version = "0.1.0" }
conduit-backend = { path = "crates/conduit-backend", version = "0.1.0" }
conduit-backend-wasapi = { path = "crates/conduit-backend-wasapi", version = "0.1.0" }
conduit-helper = { path = "crates/conduit-helper", version = "0.1.0" }
conduit-protocol = { path = "crates/conduit-protocol", version = "0.1.0" }
conduit-testing = { path = "crates/conduit-testing", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
inherits = "release"
