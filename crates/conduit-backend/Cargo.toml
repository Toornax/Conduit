[package]
name = "conduit-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conduit — traits Backend et CableControl, backend null simulé"

[features]
default = ["serde"]
serde = ["dep:serde", "conduit-core/serde"]
schema = ["serde", "dep:schemars", "conduit-core/schema"]

[dependencies]
conduit-core = { workspace = true }
serde = { workspace = true, optional = true, features = ["rc"] }
schemars = { version = "1", optional = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
