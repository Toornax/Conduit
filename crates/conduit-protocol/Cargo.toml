[package]
name = "conduit-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conduit — protocole de contrôle IPC : types, framing, versionnage"

[features]
default = []
schema = ["dep:schemars", "dep:serde_json", "conduit-core/schema", "conduit-backend/schema"]
client = ["dep:tokio"]

[dependencies]
conduit-core = { workspace = true, features = ["serde"] }
conduit-backend = { workspace = true, features = ["serde"] }
serde = { workspace = true }
rmp-serde = "1"
thiserror = { workspace = true }
schemars = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["net", "io-util", "time"], optional = true }

[dev-dependencies]
serde_json = "1"
proptest = { workspace = true }

[lints]
workspace = true

[[example]]
name = "gen-docs"
required-features = ["schema"]
