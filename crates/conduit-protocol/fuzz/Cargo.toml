[package]
name = "conduit-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
conduit-protocol = { path = ".." }

[[bin]]
name = "decoder"
path = "fuzz_targets/decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[dependencies.conduitd]
path = "../../conduitd"

# Ce crate est son propre workspace : logé sous un membre du workspace racine, il ne
# serait pas affranchi par le seul `exclude` de celui-ci (cargo ne l'y honore pas), et
# `cargo fuzz` échouerait avant de compiler quoi que ce soit.
[workspace]
