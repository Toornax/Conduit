[package]
name = "conduit-backend-wasapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conduit — backend Windows : énumération MMDevice, notifications, flux WASAPI"

[dependencies]

[target.'cfg(windows)'.dependencies]
conduit-core.workspace = true
conduit-backend.workspace = true
# Le crate `windows` de Microsoft : liaisons COM sûres + macro `implement` pour
# exposer un `IMMNotificationClient` écrit en Rust. Les features sont le strict
# nécessaire de l'énumération MMDevice et des flux WASAPI :
# - `Win32_Media_Audio` : IMMDeviceEnumerator, IMMDevice, IAudioClient(3),
#   IAudioRenderClient, IAudioCaptureClient, WAVEFORMATEX ;
# - `Win32_System_Com` : CoInitializeEx, CoCreateInstance, CoTaskMemFree ;
# - `Win32_System_Com_StructuredStorage` + `Win32_System_Variant` : PROPVARIANT ;
# - `Win32_UI_Shell_PropertiesSystem` : IPropertyStore ;
# - `Win32_Devices_FunctionDiscovery` : PKEY_Device_FriendlyName ;
# - `Win32_System_Threading` + `Win32_Security` : CreateEventW, SetEvent,
#   WaitForMultipleObjects (événement de tampon et événement d'arrêt d'un flux) ;
# - `Win32_System_Performance` : QueryPerformanceCounter/Frequency, la base de
#   temps des horodatages d'`IAudioClock` (module `clock`).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
] }
# Le code que génère `#[implement]` nomme `::windows_core` : le crate doit être une
# dépendance directe (même version que celle qu'embarque `windows`).
windows-core = "0.62"
# Vue `&mut [f32]` du tampon WASAPI (`try_cast_slice_mut`, repli par copie si
# l'alignement n'est pas celui attendu).
bytemuck = "1"

[target.'cfg(windows)'.dev-dependencies]
# Test d'endurance `two_devices` : le moteur pilote une carte et absorbe la
# dérive de l'autre par son port asynchrone (critère M1b-33).
conduit-engine.workspace = true
# Propriété de l'alignement de période du mode exclusif (M1b-32) : la période
# rendue par `aligned_period_hns` redonne bien le nombre de trames imposé par le
# pilote, à toute fréquence acceptée.
proptest = { workspace = true }

[lints]
workspace = true
