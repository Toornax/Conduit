[package]
name = "conduit-backend-wasapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conduit — backend Windows : énumération MMDevice, notifications, flux WASAPI"

[dependencies]

[target.'cfg(windows)'.dependencies]
conduit-core.workspace = true
conduit-backend.workspace = true
# Le contrat du jeu de propriétés KS privé du pilote (GUID, identifiants, disposition
# de `CableState` et son parseur) : le module `cable` s'en sert au lieu d'en recopier
# les décalages, comme le pilote lui-même. Crate `no_std` et sans dépendance.
conduit-kmd-core = { path = "../conduit-kmd-core", version = "0.1.0" }
# Le crate `windows` de Microsoft : liaisons COM sûres + macro `implement` pour
# exposer un `IMMNotificationClient` écrit en Rust. Les features sont le strict
# nécessaire de l'énumération MMDevice et des flux WASAPI :
# - `Win32_Media_Audio` : IMMDeviceEnumerator, IMMDevice, IAudioClient(3),
#   IAudioRenderClient, IAudioCaptureClient, WAVEFORMATEX ;
# - `Win32_System_Com` : CoInitializeEx, CoCreateInstance, CoTaskMemFree ;
# - `Win32_System_Com_StructuredStorage` + `Win32_System_Variant` : PROPVARIANT ;
# - `Win32_UI_Shell_PropertiesSystem` : IPropertyStore ;
# - `Win32_Devices_FunctionDiscovery` : PKEY_Device_FriendlyName ;
# - `Win32_System_Threading` + `Win32_Security` : CreateEventW, SetEvent,
#   WaitForMultipleObjects (événement de tampon et événement d'arrêt d'un flux) ;
# - `Win32_System_Performance` : QueryPerformanceCounter/Frequency, la base de
#   temps des horodatages d'`IAudioClock` (module `clock`) ;
# - `Win32_Media_Audio_Endpoints` : IAudioEndpointVolume, le volume maître et la
#   coupure d'un endpoint (module `volume`) ;
# - `Win32_System_RemoteDesktop` : ProcessIdToSessionId, la session Windows du
#   processus — la session 0 (services) n'a pas l'audio de l'utilisateur, et une
#   mesure y est sans objet (module `session`).
#
# Le module `cable` (jeu de propriétés KS privé, M1b-04) en ajoute quatre :
# - `Win32_Media_KernelStreaming` : KSCATEGORY_TOPOLOGY, IOCTL_KS_PROPERTY et les
#   drapeaux GET/SET — pris chez Microsoft plutôt que recopiés à la main ;
# - `Win32_Devices_DeviceAndDriverInstallation` : CM_Get_Device_Interface_List(_Size)W,
#   l'énumération des interfaces de périphérique publiées par l'INF, et
#   CM_Get_Device_Interface_PropertyW (M1b-05, lot A1) ;
# - `Win32_Devices_Properties` : DEVPKEY_Device_InstanceId et DEVPROP_TYPE_STRING, la
#   clé et le type de la propriété ci-dessus — c'est cette feature-là qui compile
#   `CM_Get_Device_Interface_PropertyW`, pas celle de cfgmgr32 ;
# - `Win32_Storage_FileSystem` : CreateFileW, pour ouvrir le filtre de topologie ;
# - `Win32_System_IO` : DeviceIoControl, pour lui envoyer la requête.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
] }
# Le code que génère `#[implement]` nomme `::windows_core` : le crate doit être une
# dépendance directe (même version que celle qu'embarque `windows`).
windows-core = "0.62"
# Vue `&mut [f32]` du tampon WASAPI (`try_cast_slice_mut`, repli par copie si
# l'alignement n'est pas celui attendu).
bytemuck = "1"
# La **façade** de journalisation, et rien de plus : le crate n'installe aucun
# collecteur — c'est `conduitd` qui en pose un. Un seul message la justifie
# aujourd'hui, celui qui signale deux côtés de câble renommés différemment
# (`backend::resoudre_endpoints`) : un état anormal qu'il faut dire, et que ni
# `CableInfo` ni le trait `CableControl` (tous deux portables) ne sauraient porter.
tracing = "0.1"

[target.'cfg(windows)'.dev-dependencies]
# Test d'endurance `two_devices` : le moteur pilote une carte et absorbe la
# dérive de l'autre par son port asynchrone (critère M1b-33).
conduit-engine.workspace = true
# Propriété de l'alignement de période du mode exclusif (M1b-32) : la période
# rendue par `aligned_period_hns` redonne bien le nombre de trames imposé par le
# pilote, à toute fréquence acceptée.
proptest = { workspace = true }

[lints]
workspace = true
