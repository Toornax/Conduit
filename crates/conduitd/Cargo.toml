[package]
name = "conduitd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conduit — démon : moteur, IPC, persistance"

[[bin]]
name = "conduitd"
path = "src/main.rs"

[dependencies]
conduit-core = { workspace = true, features = ["serde"] }
conduit-backend = { workspace = true, features = ["serde"] }
conduit-engine = { workspace = true }
conduit-protocol = { workspace = true, features = ["client"] }
serde = { workspace = true }
serde_json = "1"
toml = "0.8"
thiserror = { workspace = true }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "signal", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }

# Backend natif Windows (MMDevice + WASAPI) : `--backend auto` le choisit sous Windows.
[target.'cfg(windows)'.dependencies]
conduit-backend-wasapi = { workspace = true }
# Fenêtre cachée de premier niveau qui reçoit `WM_QUERYENDSESSION` / `WM_ENDSESSION`
# (module `session_end`) : c'est le seul moyen pour un processus sans console lancé par
# une tâche planifiée d'être prévenu de la fermeture de session.
# - `Win32_UI_WindowsAndMessaging` : RegisterClassW, CreateWindowExW, GetMessageW,
#   DispatchMessageW, DefWindowProcW, PostQuitMessage, WM_* ;
# - `Win32_System_LibraryLoader` : GetModuleHandleW (instance de la classe de fenêtre) ;
# - `Win32_Foundation` : HWND, WPARAM, LPARAM, LRESULT ;
# - `Win32_Graphics_Gdi` : `WNDCLASSW` (et donc `RegisterClassW`) contient un `HBRUSH`,
#   le crate `windows` les place derrière cette feature — aucun dessin n'est fait.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
